[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "som-core"
version = "0.1.0"
description = "Kohonen Self-Organising Map training library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["som_core*"]
